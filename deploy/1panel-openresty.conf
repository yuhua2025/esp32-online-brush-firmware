# ============================================================================
# 小智固件在线烧录站 —— 1Panel / OpenResty 站点配置片段
# ============================================================================
#
# 本站是纯静态站，**不需要 PHP、不需要 MySQL、不需要反向代理**。
# OpenResty（nginx）直接返回文件即可，所以：
#
#   1Panel → 网站 → 创建网站 → 类型选「静态网站」
#   （不要选「运行环境」，那是给 PHP / Node / Python 程序用的）
#
# 用法：
#   1Panel → 网站 → 你的站点 → 配置文件
#   把下面「粘贴区」的内容整体放进 server { } 里面，保存即可，1Panel 会自动 reload。
#
# 注意：`_headers` 文件只在 Netlify / Cloudflare Pages 生效，nginx 不认，
#       所以那几条缓存策略要在下面用 location 重新表达一遍。
#
# ============================================================================

# ------------------------------ 粘贴区 开始 ------------------------------

    # 页面骨架：必须实时，否则用户看不到新加的固件版本
    location = / {
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 配置与清单：必须实时，否则前端会拿到旧的版本列表、指向已删除的固件
    location = /config.json {
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /manifests/ {
        add_header Cache-Control "no-cache" always;
    }

    # 入口脚本、样式、组件：文件名没有内容哈希，走协商缓存
    # （命中 ETag 就返回 304，既不会拿到旧代码，也不会重复下载）
    location ^~ /js/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /css/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 固件：内容不变、文件名带版本号，可以长期强缓存
    location ^~ /firmware/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 保险起见显式声明：.bin 必须是二进制流类型
        # （nginx 自带 mime.types 通常已含 bin，这里只是避免被改过的配置带偏）
        default_type application/octet-stream;

        # 固件本身已是压缩后的二进制，再 gzip 一遍纯属浪费 CPU
        gzip off;
    }

# ------------------------------ 粘贴区 结束 ------------------------------


# ============================================================================
# 关于 add_header 的一个坑（改配置前务必知道）
# ============================================================================
# nginx 里 add_header 的继承规则很反直觉：**只要当前 location 里写了一条
# add_header，父级（server / http）的所有 add_header 就全部失效**，不会叠加。
#
# 所以如果你在 server 块里已经写了安全头（比如 HSTS、X-Frame-Options），
# 上面每个 location 都要把需要的头再写一遍，否则那些头在这些 location 里会消失。
#
# 想彻底躲开这个坑，可以在 http 块顶部加一行：
#     add_header_inherit merge;          # nginx >= 1.29.3
# 老版本没有这个指令，就只能像上面这样逐个 location 重复声明。


# ============================================================================
# 验证清单（部署完在服务器上跑）
# ============================================================================
# 把 example.com 换成你的域名：
#
#   # 1. 固件是二进制类型 + 强缓存
#   curl -sI https://example.com/firmware/xiaozhi_s3_allinone_v1.6.0.bin | grep -i -E "HTTP/|content-type|cache-control|content-length"
#   # 期望：200 / application/octet-stream / max-age=31536000, immutable / 16777216
#
#   # 2. 清单和配置是实时
#   curl -sI https://example.com/config.json | grep -i cache-control     # 期望：no-cache
#   curl -sI https://example.com/manifests/allinone_v1_6_0.json | grep -i cache-control
#
#   # 3. 组件 JS 的 Content-Type 正常（不能是 text/plain，否则 ES Module 加载失败）
#   curl -sI https://example.com/js/install-button.js | grep -i content-type
#   # 期望：application/javascript
#
#   # 4. 范围请求可用（部分浏览器/工具会用到）
#   curl -sI -H "Range: bytes=0-1023" https://example.com/firmware/xiaozhi_s3_allinone_v1.6.0.bin | head -1
#   # 期望：206 Partial Content
